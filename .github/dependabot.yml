# Opens pull requests when a package has a security fix or a new version, so CI can check it.
# dependabot-auto-merge.yml merges each one once that check passes.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # One pull request for all the small updates, instead of one per package
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    # TypeScript 7 is a major rewrite the app is not ready for yet. Remove this
    # when its typecheck passes, so the update comes back for CI to judge.
    ignore:
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
