name: Auto-merge Dependabot

# When Dependabot opens a pull request, CI checks it like any other change.
# Once that run passes, merge the pull request, delete its branch, and deploy
# the new main. The deploy step is needed because a merge made with the
# automatic GITHUB_TOKEN does not start another push run of CI.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

permissions:
  contents: write
  pull-requests: write

# One merge at a time, so two updates that touch the lockfile cannot race
concurrency:
  group: dependabot-auto-merge
  cancel-in-progress: false

jobs:
  merge:
    if: >
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    # There is no checkout here, so tell gh which repository to work on
    env:
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Find the Dependabot pull request
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          number=$(gh api "repos/$GITHUB_REPOSITORY/commits/$HEAD_SHA/pulls" \
            --jq '[.[] | select(.user.login == "dependabot[bot]" and .base.ref == "main" and .state == "open")] | first | .number // empty')
          echo "number=$number" >> "$GITHUB_OUTPUT"

      # GitHub can take a few seconds after CI to work out that a pull request
      # has no conflicts, and gh refuses to merge until it has.
      - name: Wait until it can merge
        id: wait
        if: steps.pr.outputs.number != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NUMBER: ${{ steps.pr.outputs.number }}
        run: |
          for attempt in $(seq 1 12); do
            state=$(gh pr view "$NUMBER" --json state --jq .state)
            mergeable=$(gh pr view "$NUMBER" --json mergeable --jq .mergeable)
            echo "attempt $attempt: $state / $mergeable"
            if [ "$state" = "MERGED" ]; then
              echo "ready=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            if [ "$mergeable" = "MERGEABLE" ]; then
              echo "ready=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            if [ "$mergeable" = "CONFLICTING" ]; then
              echo "::notice::Dependabot will rebase this pull request; leaving it open."
              echo "ready=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep 5
          done
          echo "::error::Pull request did not become mergeable in time."
          echo "ready=false" >> "$GITHUB_OUTPUT"
          exit 1

      - name: Merge it and delete its branch
        id: merge
        if: steps.wait.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NUMBER: ${{ steps.pr.outputs.number }}
        run: |
          for attempt in 1 2 3; do
            if output=$(gh pr merge "$NUMBER" --squash --delete-branch 2>&1); then
              echo "merged=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "$output"
            if [ "$(gh pr view "$NUMBER" --json state --jq .state)" = "MERGED" ]; then
              echo "merged=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep 10
          done
          message=$(printf '%s' "$output" | tr '\n' ' ')
          echo "::error title=Could not merge pull request #$NUMBER::$message"
          exit 1

      - name: Deploy the new main
        if: steps.merge.outputs.merged == 'true'
        env:
          DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: curl --fail --silent --show-error --request POST "$DEPLOY_HOOK" > /dev/null
