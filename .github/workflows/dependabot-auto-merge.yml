name: Auto-merge Dependabot

# When Dependabot opens a pull request, CI checks it like any other change.
# Once that run passes, merge the pull request, delete its branch, and deploy
# the new main. The deploy step is needed because a merge made with the
# automatic GITHUB_TOKEN does not start another push run of CI.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

permissions:
  contents: write
  pull-requests: write

# One merge at a time, so two updates that touch the lockfile cannot race
concurrency:
  group: dependabot-auto-merge
  cancel-in-progress: false

jobs:
  merge:
    if: >
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Find the Dependabot pull request
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          number=$(gh api "repos/$GITHUB_REPOSITORY/commits/$HEAD_SHA/pulls" \
            --jq '[.[] | select(.user.login == "dependabot[bot]" and .base.ref == "main" and .state == "open")] | first | .number // empty')
          echo "number=$number" >> "$GITHUB_OUTPUT"

      - name: Merge it and delete its branch
        if: steps.pr.outputs.number != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NUMBER: ${{ steps.pr.outputs.number }}
        run: gh pr merge "$NUMBER" --squash --delete-branch

      - name: Deploy the new main
        if: steps.pr.outputs.number != ''
        env:
          DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: curl --fail --silent --show-error --request POST "$DEPLOY_HOOK" > /dev/null
